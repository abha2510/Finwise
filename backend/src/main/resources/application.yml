spring:
  application:
    name: finwise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finwise}
    username: ${DB_USER:finwise}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

finwise:
  security:
    issuer: ${OKTA_ISSUER:}
    audience: ${OKTA_AUDIENCE:api://finwise}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    oauth:
      use-pkce-with-authorization-code-grant: true

logging:
  level:
    root: INFO
